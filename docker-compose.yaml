version: '3.8'
services:
  playwright-test:
    image: playwright-test
    build:
      context: .
      dockerfile: ./Dockerfile
    command: npx playwright test --reporter=html
    environment:
      - EMAIL=${EMAIL:-}
      - PASSWORD=${PASSWORD:-}
    volumes:
      - ./playwright-report:/petclinic/playwright-report
      - ./test-results:/petclinic/test-results